<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jerry AI Video</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Jerry <span>AI Video</span></div>
    <a href="#creator">Create</a>
  </header>

  <main>
    <section class="hero">
      <div class="tag">AI VIDEO CREATOR</div>
      <h1>Turn text into <span>real videos.</span></h1>
      <p>Write a prompt and generate a short AI video with Runway.</p>
    </section>

    <section id="creator" class="card">
      <h2>Create a video 🎬</h2>
      <p>Describe the scene you want to generate.</p>

      <textarea id="prompt"
        placeholder="Example: A funny Nigerian student runs into a classroom late..."></textarea>

      <div class="controls">
        <select id="ratio">
          <option value="1280:720">Landscape 16:9</option>
          <option value="720:1280">Portrait 9:16</option>
        </select>

        <select id="duration">
          <option value="5">5 seconds</option>
          <option value="10">10 seconds</option>
        </select>

        <button id="generate">Generate Video</button>
      </div>

      <div id="status"></div>
      <div id="videoBox"></div>
    </section>
  </main>

  <footer>© 2026 Jerry AI Video</footer>

  <script src="script.js"></script>
</body>
</html>
